# ============================================================================
# Docker Compose for VoltDB Examples
# ============================================================================
# This compose file runs a VoltDB cluster and example applications
#
# Usage:
#   # Start VoltDB only
#   docker-compose up -d voltdb
#
#   # Run voter example (init + benchmark)
#   docker-compose up voter
#
#   # Run with custom duration
#   DURATION=60 docker-compose up voter
#
#   # Init only (load schema/procedures)
#   MODE=init docker-compose up voter
#
#   # Run multiple examples
#   docker-compose up voter voltkv
#
# License is REQUIRED for VoltDB Enterprise:
#   export VOLTDB_LICENSE=/path/to/license.xml
#
# Without a valid license, VoltDB container will fail to start.
# ============================================================================

x-common-env: &common-env
  VOLTDB_SERVERS: voltdb:21212
  MODE: ${MODE:-init-run}
  DURATION: ${DURATION:-120}
  WARMUP: ${WARMUP:-5}
  DISPLAY_INTERVAL: ${DISPLAY_INTERVAL:-5}
  MAX_RETRIES: 60
  RETRY_INTERVAL: 5

services:
  # ==========================================================================
  # VoltDB Database Server
  # ==========================================================================
  voltdb:
    image: ${VOLTDB_IMAGE:-voltactivedata/volt-developer-edition:15.2.0_voltdb}
    container_name: voltdb
    hostname: voltdb
    command: /opt/voltdb/tools/kubernetes/test-entrypoint.sh
    ports:
      - "21212:21212"   # Client port
      - "21211:21211"   # Admin port
      - "8080:8080"     # HTTP/JSON API
    environment:
      VOLTDB_START_CONFIG: "--ignore=thp -c 1 -H voltdb"
      VOLTDB_LICENSE: "/etc/voltdb/license.xml"
      VOLTDB_DIR: /voltdb
      VOLTDB_INIT_FORCE: "true"
    volumes:
      - voltdb-data:/voltdb
      - voltdb-license-data:/etc/voltdb:ro
    healthcheck:
      test: ["CMD-SHELL", "sqlcmd --query='exec @Ping;'"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - voltdb-net

  # ==========================================================================
  # Voter Example
  # ==========================================================================
  voter:
    build:
      context: ..
      dockerfile: voter/Dockerfile
    image: voltdb-example-voter:latest
    container_name: voter-client
    depends_on:
      voltdb:
        condition: service_healthy
    environment:
      <<: *common-env
      APP_NAME: voter
      EXTRA_ARGS: "--contestants=${CONTESTANTS:-6} --maxvotes=${MAX_VOTES:-2}"
    networks:
      - voltdb-net

  # ==========================================================================
  # VoltKV Example
  # ==========================================================================
  voltkv:
    build:
      context: ..
      dockerfile: voltkv/Dockerfile
    image: voltdb-example-voltkv:latest
    container_name: voltkv-client
    depends_on:
      voltdb:
        condition: service_healthy
    environment:
      <<: *common-env
      APP_NAME: voltkv
      EXTRA_ARGS: "--poolsize=${POOL_SIZE:-100000} --getputratio=${GET_PUT_RATIO:-0.90}"
    networks:
      - voltdb-net

  # ==========================================================================
  # Bank-Offers Example
  # ==========================================================================
  bank-offers:
    build:
      context: ..
      dockerfile: bank-offers/Dockerfile
