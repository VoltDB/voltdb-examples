    container_name: bank-offers-client
    depends_on:
      voltdb:
        condition: service_healthy
    environment:
      <<: *common-env
      APP_NAME: bank-offers
    networks:
      - voltdb-net

  # ==========================================================================
  # Metrocard Example
  # ==========================================================================
  metrocard:
